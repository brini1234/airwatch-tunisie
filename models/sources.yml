version: 2

sources:
  - name: raw
    description: Tables loaded by ingest.py, exactly as the APIs sent them
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: air_quality
        description: One row per city and hour, from the Open-Meteo Air Quality API
      - name: weather
        description: One row per city and hour, from the Open-Meteo weather API
      - name: cities
        description: The five cities and their coordinates (data/cities.csv)
        config:
          freshness: null
